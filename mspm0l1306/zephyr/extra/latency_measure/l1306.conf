# tests/benchmarks/latency_measure on the LP-MSPM0L1306 (4 KB RAM). Added to Zephyr's own prj.conf.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0
# Zephyr's test sets 2,048 bytes of kernel heap for the k_malloc test. Smaller here.
CONFIG_HEAP_MEM_POOL_SIZE=256
CONFIG_ISR_STACK_SIZE=512
CONFIG_MAIN_STACK_SIZE=512
CONFIG_IDLE_STACK_SIZE=256
# The test's two thread stacks are 1,024 + this value. -768 makes each 256.
CONFIG_TEST_EXTRA_STACK_SIZE=-768
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
