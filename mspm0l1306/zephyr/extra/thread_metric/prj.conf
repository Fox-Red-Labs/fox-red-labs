# Thread-Metric on the LP-MSPM0L1306 (4 KB RAM). Zephyr's own prj.conf, plus the memory fixes.
CONFIG_TICKLESS_KERNEL=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=100
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_TIMESLICING=n
CONFIG_MP_MAX_NUM_CPUS=1
CONFIG_HW_STACK_PROTECTION=n
CONFIG_PICOLIBC_SPEED_OPTIMIZATIONS=y
CONFIG_PICOLIBC_USE_MODULE=y
CONFIG_THREAD_LOCAL_STORAGE=n
CONFIG_MEM_SLAB_POINTER_VALIDATE=n
CONFIG_MPU=n
CONFIG_ARM_MPU=n
# Added for 4 KB of RAM.
# No C library heap (the default takes all RAM left, and faults at boot when 16 bytes are left).
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0
# Zephyr's default interrupt stack is 2,048 bytes.
CONFIG_ISR_STACK_SIZE=512
CONFIG_MAIN_STACK_SIZE=768
# The porting layer prints how much of each stack was used.
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
# The interrupt tests need a software-triggered interrupt.
CONFIG_IRQ_OFFLOAD=y
