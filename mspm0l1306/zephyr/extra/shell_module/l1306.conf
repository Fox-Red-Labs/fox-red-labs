# samples/subsys/shell/shell_module on the LP-MSPM0L1306 (4 KB RAM), on top of Zephyr's prj_minimal.conf.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0
CONFIG_ISR_STACK_SIZE=512
CONFIG_MAIN_STACK_SIZE=512
CONFIG_IDLE_STACK_SIZE=256
CONFIG_SHELL_STACK_SIZE=640
CONFIG_SHELL_HISTORY=n
CONFIG_SHELL_CMD_BUFF_SIZE=32
CONFIG_SHELL_PRINTF_BUFF_SIZE=24
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=16
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=16
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_SIZE=0
CONFIG_SHELL_TAB=n
CONFIG_SHELL_TAB_AUTOCOMPLETION=n
CONFIG_SHELL_VT100_COMMANDS=n
CONFIG_SHELL_STATS=n
CONFIG_HW_STACK_PROTECTION=n
CONFIG_THREAD_STACK_INFO=y
# The sample's own demo commands: a 660-byte table for "dynamic" commands and the foreground-command demo.
CONFIG_SHELL_DYNAMIC_CMDS=n
CONFIG_SHELL_FOREGROUND_CMDS=n
# Zephyr's system work queue stack is 1,024 bytes by default.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512
