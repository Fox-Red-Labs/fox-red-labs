# CoreMark alone at the standard 2000 bytes of data, so the score compares with other boards.
# Build with -DBENCH_COREMARK_ONLY=1 -DBENCH_COREMARK_DATA=2000 (build.sh coremark2k-Os and so on).
# The other tests and the second thread are compiled out to make room.
# Static analysis puts the main thread's worst case at 2,640 to 2,680 bytes before indirect calls.
CONFIG_MAIN_STACK_SIZE=2912
CONFIG_ISR_STACK_SIZE=320
