# mcu-bench on the LP-MSPM0L1306 (4 KB RAM). The G3507 settings are in prj-g3507.conf.
CONFIG_GPIO=y
CONFIG_PICOLIBC_IO_FLOAT=y
# Stack painting and per-thread stack info: the bench prints how much of each stack was used.
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_TIMESLICING=n
# Was 6144. Sized for CoreMark at 1200 bytes of data plus its float printf (see README).
CONFIG_MAIN_STACK_SIZE=2304
# Zephyr's default is 2048, half of this chip's RAM.
CONFIG_ISR_STACK_SIZE=512
# No C library heap. The default (-1) gives malloc "all RAM left after the program"; with 8 to 16 bytes
# left, the heap setup at boot writes past the end of RAM and hard-faults (sys_heap_init from malloc_prepare).
# Nothing here calls malloc.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0
