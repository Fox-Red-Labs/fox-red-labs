% Ported by portability/radar-family/port_cfg.py for awrl1432, mmWave L SDK 05.05.04.02 motion_and_presence_detection.
%  chirpTimingCfg: start 60.5 -> 77.5 GHz
%  trackingCfg: dropped 61.4 191.8 250 (05.04 form; 05.05 computes them)
%  antGeometryCfg: 2.418 mm kept as in TI's 1432 profile; check the board's antenna before trusting angles
%  sweep 77.5 to 78.62 GHz, inside 76-81 GHz
% People tracking and counting on the IWRL6432BOOST image "Presence_Demo", mmWave SDK 05.04.00.01, wall or desk mount.
% Chirp and tracker lines from TI's 05.04 people-tracking profile (docs/research/radar-demos-ti-side-2026-11-03.md), with:
%  frame 250 ms (TI's 100 ms hung this image after about 30 frames, 2026-11-03),
%  gating and allocation from TI's fix for one person split into two tracks,
%  staticBoundaryBox ending at 4.5 m and shorter static holds so a person who leaves at the far wall does not linger,
%  maxAcceleration 2 m/s2 so a turnaround stays one track.
% Tracker chain only. Send after a reset: the demo accepts one start per boot.
sensorStop 0
channelCfg 7 3 0
chirpComnCfg 16 0 0 128 4 28 0
chirpTimingCfg 6 32 0 40 77.5
frameCfg 2 0 200 64 250 0
guiMonitor 2 0 0 0 0 1 1 0 1 0 0 0
sigProcChainCfg 32 2 3 2 8 8 1 0.3
cfarCfg 2 8 4 3 0 12.0 0 0.5 0 1 1 1
aoaFovCfg -70 70 -40 40
rangeSelCfg 0.1 10.0
clutterRemoval 1
compRangeBiasAndRxChanPhase 0.0 1.00000 0.00000 -1.00000 0.00000 1.00000 0.00000 -1.00000 0.00000 1.00000 0.00000 -1.00000 0.00000
antGeometryCfg 0 0 1 1 0 2 0 1 1 2 0 3 2.418 2.418
adcDataSource 0 adc_data_0001_CtestAdc6Ant.bin
adcLogging 0
lowPowerCfg 0
factoryCalibCfg 1 0 36 3 0x1ff000
boundaryBox -3.5 3.5 0 9 -0.5 3
sensorPosition 0 0 1.0 0 0
staticBoundaryBox -3 3 0.5 4.5 0 3
presenceBoundaryBox -3 3 0.5 7.5 0 3
gatingParam 3 2.5 2.5 2.5 8
stateParam 3 5 12 60 5 120
allocationParam 6 12 0.5 4 0.5 20
maxAcceleration 2.0 2.0 0.5
trackingCfg 1 2 100 3
sensorStart 0 0 0 0
