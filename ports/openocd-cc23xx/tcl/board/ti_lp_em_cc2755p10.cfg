#
# TI LP-EM-CC2755P10 LaunchPad development kit on an LP-XDS110 or LP-XDS110ET debugger,
# through the XDS110's CMSIS-DAP interface. With several probes plugged in, pick one first:
#   openocd -c "adapter serial <XDS110 serial>" -f board/ti_lp_em_cc2755p10.cfg ...

source [find interface/cmsis-dap.cfg]
adapter speed 4000
source [find target/ti_cc27xx.cfg]
