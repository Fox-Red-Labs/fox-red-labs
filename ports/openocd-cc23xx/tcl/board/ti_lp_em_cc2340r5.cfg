#
# TI LP-EM-CC2340R5 LaunchPad development kit on an LP-XDS110 or LP-XDS110ET debugger,
# through the XDS110's CMSIS-DAP interface. With several probes plugged in, pick one first:
#   openocd -c "adapter serial <XDS110 serial>" -f board/ti_lp_em_cc2340r5.cfg ...

source [find interface/cmsis-dap.cfg]
adapter speed 4000
source [find target/ti_cc23xx.cfg]
