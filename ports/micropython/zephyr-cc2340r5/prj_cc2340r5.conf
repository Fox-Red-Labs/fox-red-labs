# MicroPython (ports/zephyr, v1.29.0) trimmed for the LP-EM-CC2340R5: 36 kB RAM, 512 kB flash.
# Used as: west build -b lp_em_cc2340r5 <micropython>/ports/zephyr -- -DCONF_FILE=<this file>
# Same as upstream prj.conf with networking, sensors, shell, thread analyzer and VFS removed.
CONFIG_BUILD_OUTPUT_BIN=y
CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_REBOOT=y

CONFIG_STDOUT_CONSOLE=y
CONFIG_CONSOLE_HANDLER=y
CONFIG_UART_CONSOLE_DEBUG_SERVER_HOOKS=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_POLL=y
CONFIG_DEVICE_DT_METADATA=y

CONFIG_MICROPY_CONFIGFILE="mpconfigport.h"
CONFIG_MICROPY_CONFIG_ROM_LEVEL_BASIC_FEATURES=y
CONFIG_MICROPY_HEAP_SIZE=20480

CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=y

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_PWM=y
CONFIG_I2C=y
CONFIG_SPI=y

CONFIG_LEGACY_GENERATED_INCLUDE_PATH=n
