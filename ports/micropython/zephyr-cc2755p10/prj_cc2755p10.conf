# MicroPython (ports/zephyr, v1.29.0) trimmed for the LP-EM-CC2755P10 on TI Zephyr fork 3.7.0: 162 kB RAM, 1 MB flash.
# Used as: west build -b lp_em_cc2755p10 <micropython>/ports/zephyr -- -DCONF_FILE=<this file>
# Same as upstream prj.conf with networking, sensors, shell, thread analyzer and VFS removed.
CONFIG_BUILD_OUTPUT_BIN=y
CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_REBOOT=y

CONFIG_STDOUT_CONSOLE=y
CONFIG_CONSOLE_HANDLER=y
CONFIG_UART_CONSOLE_DEBUG_SERVER_HOOKS=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_POLL=y

CONFIG_MICROPY_CONFIGFILE="mpconfigport.h"
CONFIG_MICROPY_CONFIG_ROM_LEVEL_BASIC_FEATURES=y
CONFIG_MICROPY_HEAP_SIZE=65536

CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=y

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_I2C=y
CONFIG_SPI=y

CONFIG_LEGACY_GENERATED_INCLUDE_PATH=n
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
