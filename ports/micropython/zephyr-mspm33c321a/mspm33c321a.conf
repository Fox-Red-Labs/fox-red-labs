# Added to MicroPython's own ports/zephyr/prj.conf (nothing in it is removed) for the LP-MSPM33C321A.
# Used as: west build ... -DEXTRA_CONF_FILE=<this file>
# The board file has no watchdog0 alias, and extmod/machine_wdt.c needs one: switch the watchdog off.
CONFIG_WATCHDOG=n
# machine.Pin
CONFIG_GPIO=y
# machine.I2C and machine.SPI (a driver exists only in the matching Zephyr tree, see zephyr-tree.sh)
CONFIG_I2C=y
CONFIG_SPI=y
