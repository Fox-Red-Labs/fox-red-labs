# OpenOCD connection file for an MSPM0 LaunchPad through its onboard XDS110 probe (G3507 and L1306).
# Same three lines as Zephyr's boards/ti/lp_mspm0g3507/support/openocd.cfg, so you do not need Zephyr.
# The probe is chosen by the scripts with "adapter serial <PROBE>"; this file does not choose one.
source [find interface/xds110.cfg]
adapter speed 10000

source [find target/ti_mspm0.cfg]
