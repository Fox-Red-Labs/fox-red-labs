[package]
edition = "2024"
name = "frl-rust-l1306"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

# embassy-mspm0 is a community HAL (embassy-rs, MIT OR Apache-2.0), not a TI product.
# Pinned to one commit of the embassy repository; the crates.io name embassy-mspm0 is a reserved empty 0.0.0 (checked 2026-10-20).
[dependencies]
embassy-mspm0 = { git = "https://github.com/embassy-rs/embassy", rev = "7915b85a4c03cc0166f275934baade99ab845dc3", features = ["mspm0l1306rhb", "rt", "time-driver-any"] }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "7915b85a4c03cc0166f275934baade99ab845dc3", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "7915b85a4c03cc0166f275934baade99ab845dc3" }
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
panic-halt = "1.0.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = 0
panic = "abort"
