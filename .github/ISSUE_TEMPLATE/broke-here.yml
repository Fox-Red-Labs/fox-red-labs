name: Report a problem
description: A step failed. Paste the exact error text; it becomes a fix on that page once we repeat it.
title: "<board> <project>: broke at step <n>"
labels: ["report", "broke"]
body:
  - type: markdown
    attributes:
      value: "Paste the error text, do not retype it: the next person will search for those exact words. Your report is listed on the page as reported until we repeat it on our bench. Then the fix goes on the page under your GitHub handle and the report is marked fixed."
  - type: input
    id: board
    attributes:
      label: Board
      description: Start with the short id from the board page's address (board-cc2340r5.html gives cc2340r5), then the kit name.
      placeholder: cc2340r5 (LP-EM-CC2340R5)
    validations:
      required: true
  - type: input
    id: project
    attributes:
      label: Project
      description: The short name from the project page's address (project-run-zephyr.html gives run-zephyr). Leave empty if it broke before any project.
      placeholder: run-zephyr
  - type: input
    id: step
    attributes:
      label: Where it broke
      description: The step number on the page, or its first words.
      placeholder: step 6, west flash
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: The exact error text
      description: Copied from the terminal or the dialog, not retyped.
      render: text
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Your machine
      description: Your operating system, then the tool versions you used.
      placeholder: Windows 11; Zephyr 4.4.2, xPack OpenOCD 0.12.0
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: What you tried
      description: What you did about it, if anything, and whether it helped.
