# Build the repository with Jekyll (GitHub's own action, same as the classic Pages build) and
# deploy it to GitHub Pages. GitHub serves Pages from a private repository only on a paid plan, so
# while this repository is private the workflow runs by hand only. At launch: make the repository
# public, turn Pages on in Settings with Source = "GitHub Actions", and add
#   push:
#     branches: ["main"]
# under "on:" so every push publishes.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
