# Frigate 0.18.2 on the BeagleY-AI, detector = the TIDL server in this folder, input = the USB webcam at 1280x720 (never 1080p: it drops off USB)
mqtt:
  enabled: false
auth:
  enabled: false
detectors:
  deepstack:
    type: deepstack
    api_url: http://127.0.0.1:5100/v1/vision/detection
    api_timeout: 0.5
model:
  width: 416
  height: 416
  input_pixel_format: rgb
cameras:
  webcam:
    ffmpeg:
      inputs:
        - path: /dev/video-usb-cam0
          input_args: -f v4l2 -input_format mjpeg -video_size 1280x720 -framerate 15
          roles:
            - detect
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    objects:
      track:
        - person
        - dog
    record:
      enabled: false
    snapshots:
      enabled: false
