# Footprint probe: Zephyr 4.4.2 + its LVGL module on the LP-MSPM0G3519 with a dummy display (no SPI driver exists for MSPM0 in this Zephyr tree).
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=12288
CONFIG_DISPLAY=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BUTTON=y
CONFIG_SIZE_OPTIMIZATIONS=y
