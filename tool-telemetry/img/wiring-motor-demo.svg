<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 930" width="800" height="930" role="img" aria-labelledby="t d" font-family="Barlow, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Motor demo wiring</title>
<desc id="d">LP-AM13E230 stacked with the DRV8376EVM and a BLDC motor, a 12 V supply into the EVM, and a UART from the AM13 to the CC2340R5 tag, which advertises over Bluetooth LE to the CC35X1 hub.</desc>
<rect width="800" height="930" fill="#FBFAF8"/>
<style>
.box{fill:#fff;stroke:#2B2B2B;stroke-width:2}
.hot{fill:#fff;stroke:#B42418;stroke-width:3}
.h{font-size:20px;font-weight:700;fill:#1E1E1E}
.s{font-size:14px;fill:#4A4A4A}
.l{font-size:16px;font-weight:700;text-anchor:middle}
.m{font-size:13px;fill:#4A4A4A;text-anchor:middle}
.bg{fill:#FBFAF8}
</style>
<!-- supply and motor -->
<rect class="box" x="20" y="20" width="240" height="80" rx="6"/>
<text class="h" x="36" y="50">12 V bench supply</text>
<text class="s" x="36" y="74">current limit 0.5 A</text>
<text class="s" x="36" y="92">VBAT and PGND, red and black</text>
<rect class="box" x="540" y="20" width="240" height="80" rx="6"/>
<text class="h" x="556" y="50">BLY171S motor</text>
<text class="s" x="556" y="74">3 phase wires, 5 Hall wires</text>
<text class="s" x="556" y="92">no load on the shaft</text>
<!-- supply to EVM, motor to EVM -->
<line x1="110" y1="100" x2="110" y2="200" stroke="#2B2B2B" stroke-width="4"/>
<line x1="150" y1="100" x2="150" y2="200" stroke="#2B2B2B" stroke-width="4" stroke-dasharray="2 0"/>
<rect class="bg" x="170" y="135" width="150" height="32"/>
<text class="l" x="245" y="152" fill="#2B2B2B">Power</text>
<text class="m" x="245" y="166">12 V, EVM screw terminals</text>
<line x1="590" y1="100" x2="590" y2="200" stroke="#A8600A" stroke-width="4"/>
<line x1="650" y1="100" x2="650" y2="200" stroke="#2E7D4F" stroke-width="4"/>
<rect class="bg" x="440" y="140" width="140" height="32"/>
<text class="l" x="510" y="156" fill="#A8600A">Phases A B C</text>
<text class="m" x="510" y="170">3 wires to OUT A, B, C</text>
<rect class="bg" x="660" y="140" width="110" height="32"/>
<text class="l" x="715" y="156" fill="#2E7D4F">Hall harness</text>
<text class="m" x="715" y="170">5 wires</text>
<!-- EVM -->
<rect class="box" x="20" y="200" width="760" height="130" rx="6"/>
<text class="h" x="36" y="232">DRV8376EVM</text>
<text class="s" x="36" y="256">Stacks onto the LaunchPad: its J8 covers J2 and J4, its J9 covers J1 and J3.</text>
<text class="s" x="36" y="276">Jumpers: J13 on GVDD, J2 middle to J3 pin, J4 middle to DIV, J6 left open.</text>
<text class="s" x="36" y="296">TP17 (ILIMIT) to J9 pin 1: temporary lead, unvalidated (see the guide).</text>
<text class="s" x="36" y="316">Motor supply 12 V. No ground wire needed to the LaunchPad: it comes through the stack.</text>
<!-- stack wires -->
<line x1="80" y1="330" x2="80" y2="470" stroke="#2B6B9A" stroke-width="5"/>
<line x1="210" y1="330" x2="210" y2="470" stroke="#2E7D4F" stroke-width="5"/>
<line x1="340" y1="330" x2="340" y2="470" stroke="#A8600A" stroke-width="5"/>
<line x1="470" y1="330" x2="470" y2="470" stroke="#5B3F8C" stroke-width="5"/>
<line x1="600" y1="330" x2="600" y2="470" stroke="#B42418" stroke-width="5" stroke-dasharray="10 6"/>
<line x1="725" y1="330" x2="725" y2="470" stroke="#2B2B2B" stroke-width="5"/>
<g>
<rect class="bg" x="20" y="372" width="120" height="48"/>
<text class="l" x="80" y="392" fill="#2B6B9A">PWM x6</text><text class="m" x="80" y="410">J4 35 to 40</text>
<rect class="bg" x="150" y="372" width="120" height="48"/>
<text class="l" x="210" y="392" fill="#2E7D4F">Sense x5</text><text class="m" x="210" y="410">J3 23 to 29</text>
<rect class="bg" x="280" y="372" width="120" height="48"/>
<text class="l" x="340" y="392" fill="#A8600A">Halls x3</text><text class="m" x="340" y="410">J4 32 to 34</text>
<rect class="bg" x="410" y="372" width="120" height="48"/>
<text class="l" x="470" y="392" fill="#5B3F8C">Driver ctrl x3</text><text class="m" x="470" y="410">J1 8, J1 9, J2 13</text>
<rect class="bg" x="540" y="372" width="120" height="48"/>
<text class="l" x="600" y="392" fill="#B42418">ILIMIT lead</text><text class="m" x="600" y="410">J3 30 (PA4)</text>
<rect class="bg" x="670" y="372" width="110" height="48"/>
<text class="l" x="725" y="392" fill="#2B2B2B">3V3, GND</text><text class="m" x="725" y="410">J1 1, J2 20</text>
</g>
<!-- AM13 -->
<rect class="box" x="20" y="470" width="760" height="130" rx="6"/>
<text class="h" x="36" y="502">LP-AM13E230</text>
<text class="s" x="36" y="526">Runs the six-step firmware with telemetry (115200 baud). S6 and S4 on BP.</text>
<text class="s" x="36" y="546">Powered by its own USB-C cable to the Mac. Console on the same USB.</text>
<text class="s" x="36" y="566">UART TX is PA0, taken from the J12 jumper header. RX is PA1 (J12).</text>
<text class="s" x="36" y="586">Ground: the GND test point between J7 and J10 (the probe is isolated).</text>
<!-- UART -->
<line x1="70" y1="600" x2="70" y2="730" stroke="#B42418" stroke-width="5"/>
<line x1="190" y1="600" x2="190" y2="730" stroke="#B42418" stroke-width="5" stroke-dasharray="10 6"/>
<line x1="310" y1="600" x2="310" y2="730" stroke="#2B2B2B" stroke-width="5"/>
<rect class="bg" x="10" y="648" width="120" height="48"/>
<text class="l" x="70" y="668" fill="#B42418">UART TX</text><text class="m" x="70" y="686">to BP.3 (DIO22)</text>
<rect class="bg" x="130" y="648" width="120" height="48"/>
<text class="l" x="190" y="668" fill="#B42418">UART RX</text><text class="m" x="190" y="686">from BP.4 (DIO20)</text>
<rect class="bg" x="260" y="648" width="100" height="48"/>
<text class="l" x="310" y="668" fill="#2B2B2B">Ground</text><text class="m" x="310" y="686">to BP.20 (GND)</text>
<!-- tag and hub -->
<rect class="hot" x="20" y="730" width="360" height="130" rx="6"/>
<text class="h" x="36" y="762">LP-EM-CC2340R5 tag</text>
<text class="s" x="36" y="786">On an LP-XDS110, own USB-C or probe USB.</text>
<text class="s" x="36" y="806">Keeps the last 8 events, classifies each run,</text>
<text class="s" x="36" y="826">advertises over Bluetooth LE.</text>
<rect class="box" x="470" y="730" width="310" height="130" rx="6"/>
<text class="h" x="486" y="762">LP-EM-CC35X1 hub</text>
<text class="s" x="486" y="786">On an LP-XDS110ET, own USB-C.</text>
<text class="s" x="486" y="806">Scans, keeps 2,048 records, serves</text>
<text class="s" x="486" y="826">the app on Wi-Fi FRL-HUB-XXXX.</text>
<line x1="380" y1="795" x2="470" y2="795" stroke="#B42418" stroke-width="4" stroke-dasharray="3 6" stroke-linecap="round"/>
<rect class="bg" x="386" y="760" width="78" height="26"/>
<text class="l" x="425" y="778" fill="#B42418">BLE</text>
<text class="m" x="425" y="822">radio, no wire</text>
<text class="s" x="20" y="900">Solid: wire or stack contact. Dashed: optional or unconfirmed (ILIMIT lead, UART RX return). Colors group by function.</text>
<text class="s" x="20" y="920">Pin numbers: BP.n is the BoosterPack header position; Jn pin m is the LaunchPad connector.</text>
</svg>
