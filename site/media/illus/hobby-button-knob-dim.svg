<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" font-family="Barlow, Helvetica Neue, Arial, sans-serif" role="img" aria-label="The setup for Button, knob and dimmer: S2 button and knob, then GPIO and ADC, then LP-MSPM0G3519, then PWM, then LED">
