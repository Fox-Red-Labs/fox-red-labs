<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" font-family="Barlow, Helvetica Neue, Arial, sans-serif" role="img" aria-label="A terminal shows one build line finishing in 3.3 seconds and one flash line ending in Verified OK in 0.6 seconds, and the board&#x27;s LED cycles"><rect width="600" height="260" fill="#F4EFE9"/><rect x="20" y="28" width="360" height="150" rx="10" fill="#161312"/><circle cx="34" cy="42" r="4" fill="#6B625B"/><circle cx="48" cy="42" r="4" fill="#6B625B"/><circle cx="62" cy="42" r="4" fill="#6B625B"/><text x="368" y="46" font-size="11" font-weight="500" fill="#B8AEA5" text-anchor="end" xml:space="preserve">terminal on the Mac</text><text x="34" y="70" font-size="12" font-weight="500" fill="#F7F3EC" text-anchor="start" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" xml:space="preserve">$ sdkmake.sh gpio_toggle_output</text><text x="34" y="90" font-size="12" font-weight="500" fill="#B8AEA5" text-anchor="start" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" xml:space="preserve">  built in 3.3 s</text><text x="34" y="110" font-size="12" font-weight="500" fill="#F7F3EC" text-anchor="start" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" xml:space="preserve">$ tools/ocd.sh ... program ... verify</text><text x="34" y="130" font-size="12" font-weight="500" fill="#F7F3EC" text-anchor="start" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" xml:space="preserve">** Verified OK **</text><text x="34" y="150" font-size="12" font-weight="500" fill="#B8AEA5" text-anchor="start" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" xml:space="preserve">  flashed in 0.6 s</text><rect x="420" y="40" width="160" height="100" rx="10" fill="#B42418"/><text x="500.0" y="88.0" font-size="15" font-weight="700" fill="#F7F3EC" text-anchor="middle" xml:space="preserve">LP-MSPM0L1306</text><text x="500.0" y="107.0" font-size="12" font-weight="500" fill="#F7F3EC" text-anchor="middle" xml:space="preserve">RGB LED cycling</text><circle cx="500" cy="150" r="9" fill="#F7F3EC" stroke="#161312" stroke-width="2"/><circle cx="500" cy="150" r="4" fill="#B42418"/><line x1="384" y1="90" x2="408" y2="90" stroke="#161312" stroke-width="2" stroke-linecap="round"/><path d="M402 84 L412 90 L402 96" fill="none" stroke="#161312" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="218" font-size="15" font-weight="600" fill="#161312" text-anchor="middle" xml:space="preserve">No window, nothing to click. One build line, one flash line.</text><text x="300" y="240" font-size="12" font-weight="500" fill="#6B625B" text-anchor="middle" xml:space="preserve">TI&#x27;s blink example, measured on the LP-MSPM0L1306</text></svg>
