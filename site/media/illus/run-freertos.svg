<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" font-family="Barlow, Helvetica Neue, Arial, sans-serif" role="img" aria-label="A terminal reports 11 tasks made and 11 alive, ALL OK, and a bar shows 3,956 of the chip&#x27;s 4,096 bytes of RAM in use"><rect width="600" height="260" fill="#F4EFE9"/><rect x="20" y="20" width="560" height="104" rx="10" fill="#161312"/><circle cx="34" cy="34" r="4" fill="#6B625B"/><circle cx="48" cy="34" r="4" fill="#6B625B"/><circle cx="62" cy="34" r="4" fill="#6B625B"/><text x="568" y="38" font-size="11" font-weight="500" fill="#B8AEA5" text-anchor="end" xml:space="preserve">LP-MSPM0L1306, check.py</text><text x="34" y="62" font-size="12" font-weight="500" fill="#F7F3EC" text-anchor="start" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" xml:space="preserve">made 11 alive 11</text><text x="34" y="82" font-size="12" font-weight="500" fill="#F7F3EC" text-anchor="start" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" xml:space="preserve">ok    every minimal task ran in the last second</text><text x="34" y="102" font-size="12" font-weight="500" fill="#F7F3EC" text-anchor="start" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" xml:space="preserve">ALL OK</text><text x="20" y="158" font-size="17" font-weight="700" fill="#161312" text-anchor="start" xml:space="preserve">11 FreeRTOS tasks in 4 kB of RAM</text><rect x="20" y="172" width="560" height="26" rx="6" fill="#F7F3EC" stroke="#161312" stroke-width="2"/><rect x="20" y="172" width="540.9" height="26" rx="6" fill="#B42418"/><text x="20" y="222" font-size="13" font-weight="600" fill="#161312" text-anchor="start" xml:space="preserve">3,956 bytes used</text><text x="580" y="222" font-size="13" font-weight="500" fill="#6B625B" text-anchor="end" xml:space="preserve">4,096 bytes on the chip, 140 left</text><text x="20" y="244" font-size="12" font-weight="500" fill="#6B625B" text-anchor="start" xml:space="preserve">No TI