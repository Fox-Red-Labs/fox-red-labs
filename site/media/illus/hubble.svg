<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" font-family="Barlow, Helvetica Neue, Arial, sans-serif" role="img" aria-label="A satellite among stars receiving the radio signal of a small Bluetooth board on the ground">
<style>
  .arc { animation: arc 1.8s infinite; opacity:.15; } .a2 { animation-delay:.3s } .a3 { animation-delay:.6s }
  @keyframes arc { 0%{opacity:.1} 40%{opacity:1} 100%{opacity:.1} }
  .tw { animation: tw 3s infinite; }
  .mv { animation: mv 12s linear infinite alternate; }
  @keyframes tw { 0%,100%{opacity:.25} 50%{opacity:.9} }
  @keyframes mv { from{transform:translate(-30px,0)} to{transform:translate(30px,0)} }
  @media (prefers-reduced-motion: reduce) { .arc,.pulse,.tw,.mv { animation: none; opacity: 1; } }
</style>
<rect width="600" height="260" fill="#F4EFE9"/>
