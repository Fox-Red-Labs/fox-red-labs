<line x1="434" y1="186" x2="434" y2="206" stroke="#161312" stroke-width="2.5"/>
<text x="434" y="226" text-anchor="middle" font-size="15" fill="#6B625B">handler starts</text>
<text x="250" y="180" text-anchor="middle" font-size="16" font-weight="600" fill="#161312">25 to 28 cycles</text>
<text x="588" y="250" text-anchor="end" font-size="12" fill="#6B625B">drawing; cycles as measured on this board</text></svg>
