<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" font-family="Barlow, Helvetica Neue, Arial, sans-serif" role="img" aria-label="Two small boards joined by three wires: host pin 2 TX to radio pin 14 RX, radio pin 7 TX to host pin 5 RX, and ground; the host&#x27;s console answers state with leader"><rect width="600" height="260" fill="#F4EFE9"/><rect x="20" y="14" width="170" height="150" rx="10" fill="#B42418"/><text x="105.0" y="87.0" font-size="15" font-weight="700" fill="#F7F3EC" text-anchor="middle" xml:space="preserve">LP-CC1354P10-1</text><text x="105.0" y="106.0" font-size="12" font-weight="500" fill="#F7F3EC" text-anchor="middle" xml:space="preserve">host, OpenThread</text><rect x="410" y="14" width="170" height="150" rx="10" fill="#B42418"/><text x="495.0" y="87.0" font-size="15" font-weight="700" fill="#F7F3EC" text-anchor="middle" xml:space="preserve">LP-EM-CC2340R5</text><text x="495.0" y="106.0" font-size="12" font-weight="500" fill="#F7F3EC" text-anchor="middle" xml:space="preserve">Thread radio</text><line x1="192" y1="64" x2="408" y2="64" stroke="#161312" stroke-width="3" stroke-linecap="round"/><text x="200" y="58" font-size="11" font-weight="600" fill="#161312" text-anchor="start" xml:space="preserve">pin 2 (DIO23) TX</text><text x="400" y="58" font-size="11" font-weight="600" fill="#161312" text-anchor="end" xml:space="preserve">RX pin 14 (DIO12)</text><line x1="192" y1="98" x2="408" y2="98" stroke="#161312" stroke-width="3" stroke-linecap="round"/><text x="200" y="92" font-size="11" font-weight="600" fill="#161312" text-anchor="start" xml:space="preserve">pin 5 (DIO22) RX</text><text x="400" y="92" font-size="11" font-weight="600" fill="#161312" text-anchor="end" xml:space="preserve">TX pin 7 (DIO18)</text><line x1="192" y1="132" x2="408" y2="132" stroke="#6B625B" stroke-width="3" stroke-linecap="round"/><text x="200" y="126" font-size="11" font-weight="600" fill="#161312" text-anchor="start" xml:space="preserve">pin 20 (GND)</text><text x="400" y="126" font-size="11" font-weight="600" fill="#161312" text-anchor="end" xml:space="preserve">GND pin 22</text><text x="300" y="156" font-size="12" font-weight="500" fill="#6B625B" text-anchor="middle" xml:space="preserve">3 wires, 921,600 baud</text><rect x="20" y="178" width="290" height="72" rx="10" fill="#161312"/><circle cx="34" cy="192" r="4" fill="#6B625B"/><circle cx="48" cy="192" r="4" fill="#6B625B"/><circle cx="62" cy="192" r="4" fill="#6B625B"/><text x="298" y="196" font-size="11" font-weight="500" fill="#B8AEA5" text-anchor="end" xml:space="preserve">host console</text><text x="34" y="220" font-size="12" font-weight="500" fill="#F7F3EC" text-anchor="start" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" xml:space="preserve">&gt; state</text><text x="34" y="240" font-size="12" font-weight="500" fill="#F7F3EC" text-anchor="start" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" xml:space="preserve">leader</text><text x="326" y="208" font-size="13" font-weight="600" fill="#161312" text-anchor="start" xml:space="preserve">Leader 16 s after a fresh</text><text x="326" y="226" font-size="13" font-weight="600" fill="#161312" text-anchor="start" xml:space="preserve">dataset. No Linux computer.</text></svg>
