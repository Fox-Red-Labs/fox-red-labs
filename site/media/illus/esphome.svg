<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" font-family="Barlow, Helvetica Neue, Arial, sans-serif" role="img" aria-label="A short ESPHome YAML file is compiled and uploaded to a CC2755P10 board, which then shows up in Home Assistant with an LED switch and a chip temperature sensor"><rect width="600" height="260" fill="#F4EFE9"/><rect x="20" y="20" width="230" height="220" rx="10" fill="#161312"/><text x="34" y="42" font-size="12" font-weight="500" fill="#B8AEA5" text-anchor="start" xml:space="preserve">frl-cc27xx.yaml</text><text x="34" y="66" font-size="11.5" font-weight="500" fill="#F7F3EC" text-anchor="start" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" xml:space="preserve">esphome:</text><text x="34" y="83" font-size="11.5" font-weight="500" fill="#F7F3EC" text-anchor="start" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" xml:space="preserve">  name: frl-cc27xx</text><text x="34" y="100" font-size="11.5" font-weight="500" fill="#F7F3EC" text-anchor="start" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" xml:space="preserve">external_components: ...</text><text x="34" y="117" font-size="11.5" font-weight="500" fill="#F7F3EC" text-anchor="start" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" xml:space="preserve">cc27xx:</text><text x="34" y="134" font-size="11.5" font-weight="500" fill="#F7F3EC" text-anchor="start" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" xml:space="preserve">  board: LP_EM_CC2755P10</text><text x="34" y="151" font-size="11.5" font-weight="500" fill="#F7F3EC" text-anchor="start" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" xml:space="preserve">zigbee:</text><text x="34" y="168" font-size="11.5" font-weight="500" fill="#F7F3EC" text-anchor="start" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" xml:space="preserve">  router: true</text><text x="34" y="185" font-size="11.5" font-weight="500" fill="#F7F3EC" text-anchor="start" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" xml:space="preserve">switch:</text><text x="34" y="202" font-size="11.5" font-weight="500" fill="#F7F3EC" text-anchor="start" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" xml:space="preserve">  - platform: gpio</text><text x="34" y="219" font-size="11.5" font-weight="500" fill="#F7F3EC" text-anchor="start" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" xml:space="preserve">      pin: DIO16</text><line x1="262" y1="100" x2="314" y2="100" stroke="#161312" stroke-width="2" stroke-linecap="round"/><path d="M308 94 L318 100 L308 106" fill="none" stroke="#161312" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="292" y="86" font-size="12" font-weight="500" fill="#6B625B" text-anchor="middle" xml:space="preserve">esphome</text><text x="292" y="122" font-size="12" font-weight="500" fill="#6B625B" text-anchor="middle" xml:space="preserve">compile</text><text x="292" y="138" font-size="12" font-weight="500" fill="#6B625B" text-anchor="middle" xml:space="preserve">upload</text><rect x="330" y="20" width="250" height="56" rx="10" fill="#B42418"/><text x="455.0" y="46.0" font-size="15" font-weight="700" fill="#F7F3EC" text-anchor="middle" xml:space="preserve">LP-EM-CC2755P10</text><text x="455.0" y="65.0" font-size="12" font-weight="500" fill="#F7F3EC" text-anchor="middle" xml:space="preserve">Zigbee router</text><rect x="330" y="96" width="250" height="144" rx="10" fill="#F7F3EC" stroke="#161312" stroke-width="2"/><text x="346" y="122" font-size="15" font-weight="700" fill="#161312" text-anchor="start" xml:space="preserve">frl-cc27xx</text><text x="346" y="140" font-size="12" font-weight="500" fill="#6B625B" text-anchor="start" xml:space="preserve">in Home Assistant, over Zigbee</text><text x="346" y="176" font-size="15" font-weight="600" fill="#161312" text-anchor="start" xml:space="preserve">LED</text><rect x="518" y="160" width="46" height="24" rx="12" fill="#B42418"/><circle cx="552" cy="172" r="9" fill="#F7F3EC"/><text x="346" y="218" font-size="15" font-weight="600" fill="#161312" text-anchor="start" xml:space="preserve">Chip temperature</text><text x="564" y="218" font-size="12" font-weight="500" fill="#6B625B" text-anchor="end" xml:space="preserve">every 30 s</text></svg>
