<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" font-family="Barlow, Helvetica Neue, Arial, sans-serif" role="img" aria-label="An Arduino sketch goes through a 649-line API layer onto an LP-MSPM0G3507; the serial port prints a line each second with millis, micros, button states and the touch chip&#x27;s identity"><rect width="600" height="260" fill="#F4EFE9"/><rect x="20" y="24" width="150" height="56" rx="10" fill="#F7F3EC" stroke="#161312" stroke-width="2"/><text x="95" y="58" font-size="15" font-weight="600" fill="#161312" text-anchor="middle" xml:space="preserve">Arduino sketch</text><line x1="174" y1="52" x2="198" y2="52" stroke="#161312" stroke-width="2" stroke-linecap="round"/><path d="M192 46 L202 52 L192 58" fill="none" stroke="#161312" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="210" y="24" width="190" height="56" rx="10" fill="#F7F3EC" stroke="#161312" stroke-width="2"/><text x="305" y="48" font-size="15" font-weight="600" fill="#161312" text-anchor="middle" xml:space="preserve">Arduino API layer</text><text x="305" y="66" font-size="12" font-weight="500" fill="#6B625B" text-anchor="middle" xml:space="preserve">649 lines, ours</text><line x1="404" y1="52" x2="428" y2="52" stroke="#161312" stroke-width="2" stroke-linecap="round"/><path d="M422 46 L432 52 L422 58" fill="none" stroke="#161312" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="440" y="24" width="140" height="56" rx="10" fill="#B42418"/><text x="510.0" y="57.0" font-size="15" font-weight="700" fill="#F7F3EC" text-anchor="middle" xml:space="preserve">LP-MSPM0G3507</text><rect x="20" y="104" width="560" height="100" rx="10" fill="#161312"/><circle cx="34" cy="118" r="4" fill="#6B625B"/><circle cx="48" cy="118" r="4" fill="#6B625B"/><circle cx="62" cy="118" r="4" fill="#6B625B"/><text x="568" y="122" font-size="11" font-weight="500" fill="#B8AEA5" text-anchor="end" xml:space="preserve">serial port, 115200 baud</text><text x="34" y="146" font-size="11" font-weight="500" fill="#F7F3EC" text-anchor="start" font-family="JetBrains Mono, ui-monospace, Menlo, monospace" xml:space="preserve">millis=1000 micros=1001725 S1=1 S2=1 touch vendor/chip/fw=0x11 0x64 0x12</text><text x="34" y="168" font-size="11" font-weight="500" fill="#B8AEA5" text-anchor="start" xml:space="preserve">Arduino&#x27;s own Serial, millis and Wire calls running on the chip</text><text x="300" y="232" font-size="13" font-weight="500" fill="#6B625B" text-anchor="middle" xml:space="preserve">Arduino_GFX&#x27;s own example also drew on an attached screen</text></svg>
