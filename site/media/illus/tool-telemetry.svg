<circle cx="40" cy="208" r="11" fill="none" stroke="#F7F3EC" stroke-width="3"/><circle cx="40" cy="208" r="3" fill="#F7F3EC"/>
<rect x="60" y="202" width="26" height="12" rx="2" fill="#2A2421" stroke="#6B625B"/>
<rect x="26" y="226" width="62" height="6" rx="3" fill="#6B625B"/>
<rect x="100" y="201" width="24" height="22" rx="4" fill="#F7F3EC" stroke="#161312" stroke-width="2"/>
<circle class="" cx="112" cy="212" r="4" fill="#B42418"/>
<g fill="none" stroke="#B42418" stroke-width="3.5" stroke-linecap="round"><path class="arc id2 a0" d="M134 206 A8 8 0 0 1 134 218"/><path class="arc id2 a1" d="M141 201 A15 15 0 0 1 141 223"/><path class="arc id2 a2" d="M148 196 A22 22 0 0 1 148 228"/></g>
<path d="M158 212 L296 136" stroke="#6B625B" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round" fill="none" opacity=".5"/>
<text x="215" y="252" font-size="16" font-weight="700" fill="#6B625B" text-anchor="middle">Bluetooth LE</text>
<g>
  <line x1="342" y1="104" x2="342" y2="80" stroke="#161312" stroke-width="5" stroke-linecap="round"/>
  <g fill="none" stroke="#B42418" stroke-width="4" stroke-linecap="round">
    <path class="wf" d="M334 72 a11 11 0 0 1 16 0"/>
