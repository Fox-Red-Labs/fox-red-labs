<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" font-family="Barlow, Helvetica Neue, Arial, sans-serif" role="img" aria-label="Three asset tags on motor-driven equipment send Bluetooth LE bursts to a site hub; one tag reports a short run, the hub forwards it over Wi-Fi, and the run-event count on a phone goes up by one">
<style>
  .arc { opacity: .15; }
  .id0 { animation: idle 3s infinite; } .id2 { animation: idle 3s infinite; --o: 1.3s; }
  .ev { animation: burst 6s infinite; }
  .arc { animation-delay: calc(var(--o, 0s) + var(--s, 0s)); } .a1 { --s: .12s; } .a2 { --s: .24s; }
  .bar { transform-box: fill-box; transform-origin: left center; animation: bar 6s infinite; }
  .led { animation: led 6s infinite; }
  .pk1 { animation: pk1 6s infinite; opacity: 0; }
  .pk2 { animation: pk2 6s infinite; opacity: 0; }
  .hubled { animation: hubled 6s infinite; }
  .wf { opacity: .15; animation: wf 6s infinite; } .w1 { animation-delay: .15s; } .w2 { animation-delay: .3s; }
  .n1 { animation: n1 6s infinite; } .n2 { opacity: 0; animation: n2 6s infinite; }
  .ring { opacity: 0; animation: ring 6s infinite; }
  @keyframes idle { 0%,100% { opacity: .15 } 25% { opacity: .7 } 50% { opacity: .15 } }
  @keyframes burst { 0%,24% { opacity: .15 } 27%,34% { opacity: 1 } 40%,100% { opacity: .15 } }
  @keyframes bar { 0% { transform: scaleX(0) } 12%,22% { transform: scaleX(1) } 24%,100% { transform: scaleX(0) } }
  @keyframes led { 0%,24% { fill: #6B625B } 25%,36% { fill: #B42418 } 38%,100% { fill: #6B625B } }
  @keyframes pk1 { 0%,30% { transform: translateX(0); opacity: 0 } 32% { opacity: 1 } 54% { transform: translateX(166px); opacity: 1 } 56%,100% { transform: translateX(166px); opacity: 0 } }
  @keyframes pk2 { 0%,60% { transform: translateX(0); opacity: 0 } 62% { opacity: 1 } 80% { transform: translateX(100px); opacity: 1 } 82%,100% { transform: translateX(100px); opacity: 0 } }
  @keyframes hubled { 0%,54% { fill: #6B625B } 56%,70% { fill: #B42418 } 72%,100% { fill: #6B625B } }
  @keyframes wf { 0%,56% { opacity: .15 } 60%,70% { opacity: 1 } 76%,100% { opacity: .15 } }
  @keyframes n1 { 0%,82% { opacity: 1 } 83%,100% { opacity: 0 } }
  @keyframes n2 { 0%,82% { opacity: 0 } 83%,100% { opacity: 1 } }
  @keyframes ring { 0%,82% { opacity: 0 } 84% { opacity: 1 } 96%,100% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) {
    .arc,.ev,.id0,.id2,.wf,.n1,.n2,.bar,.led,.hubled,.pk1,.pk2,.ring { animation: none !important; }
    .arc,.wf { opacity: 1; } .n1,.pk1,.pk2,.ring { opacity: 0; } .n2 { opacity: 1; }
    .bar { transform: scaleX(1); } .led,.hubled { fill: #B42418; }
  }
</style>
<rect width="600" height="260" fill="#F4EFE9"/>
<text x="18" y="22" font-size="16" font-weight="700" fill="#161312">equipment + tags</text>
<rect x="18" y="34" width="78" height="52" rx="7" fill="#161312"/>
<circle cx="40" cy="56" r="11" fill="none" stroke="#F7F3EC" stroke-width="3"/><circle cx="40" cy="56" r="3" fill="#F7F3EC"/>
