  <text x="342" y="196" font-size="17" font-weight="700" fill="#161312" text-anchor="middle">site hub</text>
</g>
<line x1="388" y1="136" x2="484" y2="136" stroke="#6B625B" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round" opacity=".5"/>
<text x="436" y="164" font-size="16" font-weight="700" fill="#6B625B" text-anchor="middle">Wi-Fi</text>
<g>
  <rect x="490" y="36" width="100" height="196" rx="14" fill="#F7F3EC" stroke="#161312" stroke-width="3"/>
  <rect x="498" y="52" width="84" height="164" rx="6" fill="#161312"/>
  <rect class="ring" x="498" y="52" width="84" height="164" rx="6" fill="none" stroke="#B42418" stroke-width="4"/>
  <text class="n1" x="540" y="140" font-size="44" font-weight="700" fill="#F7F3EC" text-anchor="middle">41</text>
  <text class="n2" x="540" y="140" font-size="44" font-weight="700" fill="#F7F3EC" text-anchor="middle">42</text>
  <text x="540" y="178" font-size="16" font-weight="700" fill="#F4EFE9" text-anchor="middle">run events</text>
</g>
<circle class="pk1" cx="134" cy="136" r="7" fill="#B42418"/>
<circle class="pk2" cx="384" cy="136" r="7" fill="#B42418"/>
</svg>
