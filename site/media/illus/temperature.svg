<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" font-family="Barlow, Helvetica Neue, Arial, sans-serif" role="img" aria-label="A board&#x27;s onboard thermistor reads 22.8 degrees Celsius, shown as a large readout"><rect width="600" height="260" fill="#F4EFE9"/><rect x="24" y="60" width="190" height="110" rx="10" fill="#B42418"/><text x="119.0" y="113.0" font-size="15" font-weight="700" fill="#F7F3EC" text-anchor="middle" xml:space="preserve">LP-MSPM0L1306</text><text x="119.0" y="132.0" font-size="12" font-weight="500" fill="#F7F3EC" text-anchor="middle" xml:space="preserve">board thermistor</text><line x1="222" y1="115" x2="262" y2="115" stroke="#161312" stroke-width="2" stroke-linecap="round"/><path d="M256 109 L266 115 L256 121" fill="none" stroke="#161312" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="280" y="40" width="296" height="150" rx="14" fill="#F7F3EC" stroke="#161312" stroke-width="2"/><text x="428" y="128" font-size="56" font-weight="700" fill="#161312" text-anchor="middle" xml:space="preserve">22.8 °C</text><text x="428" y="164" font-size="14" font-weight="500" fill="#6B625B" text-anchor="middle" xml:space="preserve">printed every second</text><text x="300" y="228" font-size="12" font-weight="500" fill="#6B625B" text-anchor="middle" xml:space="preserve">Measured on the LP-MSPM0L1306 with its onboard thermistor</text></svg>
