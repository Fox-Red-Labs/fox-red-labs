% PresenceDetect-fastclear.cfg: TI's PresenceDetect.cfg (SDK 05.05, xwrl6432boost) with ONE change, for the NEXT boot only (the demo takes one sensorStart per boot).
% Change: minorStateCfg last argument minor2emptyThre 20 -> 12 frames. TI: "A motion status is preserved if it recorded at least one motion detection in the last minor2emptyThre frames"
% (MMWAVE-L-SDK 05.05 Motion and Presence Detection OOB Demo page, minorStateCfg table). At about 3.9 frames a second: 20 frames = 5.1 s hold, 12 frames = 3.1 s hold.
% Also lowPowerCfg 1 -> 0, matching the configuration the radar evaluation already runs, so the CLI stays readable while it streams. Argument order: pointThre1 pointThre2 snrThre2 pointHistThre1 pointHistThre2 snrHistThre2 histBufferSize minor2emptyThre. Everything else is the stock line.
% Expected time from the last movement to the held presence clearing: 1.5 s plus up to one frame, against 5.1 s stock. Not yet measured.
% ***************************************************************
% PresenceDetect:  Chirp configuration and Processing chain are 
% optimized to detect any kind of motion, including fine movements 
% (even small movements that are present while sitting still, 
% such as, movement caused by typing, breathing, etc.).  However, 
% there is no velocity measurement reported in this case.  
% It is typically useful for applications such as identifying 
% presence or absence of occupants in an indoor setting.  
% Localization (Angle estimation) of the object is possible.
% ***************************************************************
sensorStop 0
channelCfg 7 3 0
chirpComnCfg 8 0 0 256 4 23 2
chirpTimingCfg 6 24 0 75 60.5
frameCfg 2 4 600 4 250 0
guiMonitor 2 2 0 0 0 1 1 0 0 0 0
sigProcChainCfg 64 4 2 2 4 4 0 0.5 0
cfarCfg 2 8 4 3 0 15 0 0.5 0 1 1 1
aoaFovCfg -70 70 -60 60
rangeSelCfg 0.25 7.5
clutterRemoval 1
compRangeBiasAndRxChanPhase 0.0 1.00000 0.00000 -1.00000 0.00000 1.00000 0.00000 -1.00000 0.00000 1.00000 0.00000 -1.00000 0.00000
adcDataSource 0 adc_data_0001_CtestAdc6Ant.bin
adcLogging 0
lowPowerCfg 0
factoryCalibCfg 1 0 36 3 0x1ff000
rangeSNRCompensation 1 5 11 5 6 -20 20 -90 90 3
sensorPosition 0 0 1.5 0 0
mpdBoundaryBox 1 -3.5 0 0 3.5 0 3
mpdBoundaryBox 2 -3.5 0 3.51 7 0 3
mpdBoundaryBox 3 0.01 3.5 0 3.5 0 3
mpdBoundaryBox 4 0.01 3.5 3.51 7 0 3
minorStateCfg 4 3 12 8 5 20 4 12
clusterCfg 1 1 2
baudRate 1250000
sensorStart 0 0 0 0
