% PresenceDetect-zones.cfg: generated by iwrl6432boost/zones/zones.py from zones.json. Do not edit by hand.
% It is PresenceDetect-hold12.cfg (TI's PresenceDetect.cfg with minor2emptyThre 12 and lowPowerCfg 0) with the four mpdBoundaryBox lines replaced.
% mpdBoundaryBox <zone> <xMin> <xMax> <yMin> <yMax> <zMin> <zMax>. The demo ignores the zone number and numbers the boxes in the order sent; it reads only x and y.
% ***************************************************************
% PresenceDetect:  Chirp configuration and Processing chain are 
% optimized to detect any kind of motion, including fine movements 
% (even small movements that are present while sitting still, 
% such as, movement caused by typing, breathing, etc.).  However, 
% there is no velocity measurement reported in this case.  
% It is typically useful for applications such as identifying 
% presence or absence of occupants in an indoor setting.  
% Localization (Angle estimation) of the object is possible.
% ***************************************************************
sensorStop 0
channelCfg 7 3 0
chirpComnCfg 8 0 0 256 4 23 2
chirpTimingCfg 6 24 0 75 60.5
frameCfg 2 4 600 4 250 0
guiMonitor 2 2 0 0 0 1 1 0 0 0 0
sigProcChainCfg 64 4 2 2 4 4 0 0.5 0
cfarCfg 2 8 4 3 0 15 0 0.5 0 1 1 1
aoaFovCfg -70 70 -60 60
rangeSelCfg 0.25 7.5
clutterRemoval 1
compRangeBiasAndRxChanPhase 0.0 1.00000 0.00000 -1.00000 0.00000 1.00000 0.00000 -1.00000 0.00000 1.00000 0.00000 -1.00000 0.00000
adcDataSource 0 adc_data_0001_CtestAdc6Ant.bin
adcLogging 0
lowPowerCfg 0
factoryCalibCfg 1 0 36 3 0x1ff000
rangeSNRCompensation 1 5 11 5 6 -20 20 -90 90 3
sensorPosition 0 0 1.5 0 0
% zone 1: desk
mpdBoundaryBox 1 -3.5 3.5 0.25 3.5 0 3
% zone 2: middle
mpdBoundaryBox 2 -3.5 3.5 3.5 5.5 0 3
% zone 3: far room
mpdBoundaryBox 3 -3.5 3.5 5.5 6.5 0 3
% zone 4: door end
mpdBoundaryBox 4 -3.5 3.5 6.5 7.5 0 3
minorStateCfg 4 3 12 8 5 20 4 12
clusterCfg 1 1 2
baudRate 1250000
sensorStart 0 0 0 0
