# E43 control: Wi-Fi and Zigbee end device, no Bluetooth at all (separates the Bluetooth proxy from Wi-Fi as the cause).
# (E43 proper: one ESP32-C6 as Bluetooth proxy and Zigbee end device at once.) Same name and keys as the house proxy
# (frl-ble-proxy), so Home Assistant keeps the device. The Zigbee side reports a counter once a second in the
# "fast" phase and nothing in the "idle" phase; every 10 s the log prints how many Bluetooth advertisements the
# tracker saw in that window, with the phase, for 60 s phases (idle, fast, idle, ...).
substitutions:
  name: frl-wifi-zigbee
  scan_interval: 320ms
  scan_window: 320ms   # E43 variants: 30ms

esphome:
  name: ${name}
  friendly_name: FRL wifi zigbee

esp32:
  variant: esp32c6
  flash_size: 8MB
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

globals:
  - id: adv_count
    type: int
    initial_value: "0"
  - id: tick
    type: int
    initial_value: "0"
  - id: fast
    type: bool
    initial_value: "false"
  - id: zcount
    type: int
    initial_value: "0"

zigbee:
  model: "FRL proxy"

sensor:
  - platform: template
    name: "Test counter"
    id: test_counter
    accuracy_decimals: 0
    update_interval: never
    report: force
  - platform: internal_temperature
    name: "Chip temperature"
    update_interval: 60s

interval:
  - interval: 10s
    then:
      - lambda: |-
          ESP_LOGW("e43", "phase=%s window=%d adverts=%d", id(fast) ? "zigbee_fast" : "zigbee_idle", id(tick), 0);
          id(tick)++;
          if (id(tick) % 6 == 0) id(fast) = !id(fast);
  - interval: 1s
    then:
      - lambda: |-
          if (id(fast)) { id(zcount)++; id(test_counter).publish_state(id(zcount)); }
