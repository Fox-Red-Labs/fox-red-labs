# E37 variant: the minimal image plus an idle esp32_ble_tracker (no proxy), which turns the Wi-Fi/Bluetooth coexistence code on.
# The smallest useful ESPHome device on the ESP32-C6: Wi-Fi, the Home Assistant API, OTA and the logger,
# nothing else. Experiment: the yardstick for docs/archive/esphome-on-ti-plan.md (flash, RAM at boot, OTA size and time).
#   esphome compile frl-esphome-minimal.yaml     then read the size table it prints and .esphome/build/*/...map
substitutions:
  name: frl-esphome-minimal

esphome:
  name: ${name}

esp32:
  variant: esp32c6
  flash_size: 8MB
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

esp32_ble_tracker:

debug:
  update_interval: 30s

sensor:
  - platform: debug
    free:
      name: "Heap free"
