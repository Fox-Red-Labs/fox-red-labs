# Zephyr alone on one A53, in on-chip SRAM, entered at EL3 with no TF-A, no TIFS services and no DDR.
# Everything that talks to firmware (SCMI clocks and power domains, PSCI for the second core) is off; the UART must
# already be clocked when Zephyr starts (true after a JTAG load with the ROM's clock tree; to be measured on the board).
CONFIG_ARMV8_A_NS=n
CONFIG_ARM_SCMI=n
CONFIG_CLOCK_CONTROL=n
CONFIG_POWER_DOMAIN=n
CONFIG_PM_DEVICE=n
CONFIG_PM_CPU_OPS=n
CONFIG_SMP=n
CONFIG_MP_MAX_NUM_CPUS=1
CONFIG_AARCH64_IMAGE_HEADER=n
# Translation tables are 4 KB each and live in SRAM. 8 is Zephyr's non-SMP default and the number this image needs:
# with 6 the kernel panics in Renode when the pin-control driver maps its registers (E208, 2026-10-18).
CONFIG_MAX_XLAT_TABLES=8
# Drivers the board file turns on that a DDR-less hello world does not need.
CONFIG_FLASH=n
CONFIG_MSPI=n
CONFIG_ADC=n
CONFIG_I2C=n
CONFIG_EEPROM=n
CONFIG_SDHC=n
CONFIG_DISK_DRIVERS=n
CONFIG_PWM=n
CONFIG_COUNTER=n
CONFIG_WATCHDOG=n
CONFIG_RTC=n
CONFIG_GPIO=n
