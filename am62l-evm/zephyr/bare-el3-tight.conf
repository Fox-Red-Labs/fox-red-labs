# bare-el3.conf plus every size cut that costs nothing on a hello world, to find the floor for the 80 KB MAIN-SRAM map.
# Four translation tables map the kernel, the UART and the GIC (6 is Zephyr's default here, 24 KB). Stacks are the
# arm64 minimums that still run. The dense 992-entry ISR table cannot be made sparse on this arch (the local-declaration
# option has unmet dependencies, build warning 2026-10-18), so it stays.
CONFIG_MAX_XLAT_TABLES=4
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_IDLE_STACK_SIZE=1024
CONFIG_ISR_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
