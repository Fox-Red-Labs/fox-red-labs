# Image D (E242, Linux loader): Zephyr on core 1 started by TF-A's PSCI CPU_ON, in the non-secure world, at the EL TF-A hands over (EL2 or EL1;
# Zephyr's reset code handles both and runs the kernel at EL1). Replaces bare-el3.conf: no EL3 code, no firmware calls.
# TF-A already enabled ICC_SRE for the non-secure world; Zephyr does only its own redistributor wake and ICC_* setup for the current EL.
CONFIG_ARMV8_A_NS=y
# Linux owns SCMI and PSCI. Zephyr makes no SMC calls: nm on the ELF must show no psci or smccc symbol.
CONFIG_ARM_SCMI=n
CONFIG_CLOCK_CONTROL=n
CONFIG_POWER_DOMAIN=n
CONFIG_PM_DEVICE=n
CONFIG_PM_CPU_OPS=n
CONFIG_PM_CPU_OPS_PSCI=n
CONFIG_SMP=n
CONFIG_MP_MAX_NUM_CPUS=1
CONFIG_AARCH64_IMAGE_HEADER=n
CONFIG_MAX_XLAT_TABLES=6
CONFIG_FLASH=n
CONFIG_MSPI=n
CONFIG_ADC=n
CONFIG_I2C=n
CONFIG_EEPROM=n
CONFIG_SDHC=n
CONFIG_DISK_DRIVERS=n
CONFIG_PWM=n
CONFIG_COUNTER=n
CONFIG_WATCHDOG=n
CONFIG_RTC=n
CONFIG_GPIO=n
