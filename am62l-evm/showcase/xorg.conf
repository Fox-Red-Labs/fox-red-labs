# Xorg on the AM62L HDMI output (tidss, no GPU): modesetting with acceleration off, so xrandr can switch the
# real HDMI mode (640x480 for 3D; the monitor scales it to full screen).
Section "Device"
  Identifier "tidss"
  Driver "modesetting"
  Option "kmsdev" "/dev/dri/card0"
  Option "AccelMethod" "none"
  Option "ShadowFB" "true"
EndSection
Section "ServerFlags"
  Option "AutoAddDevices" "true"
  Option "BlankTime" "0"
  Option "StandbyTime" "0"
  Option "SuspendTime" "0"
  Option "OffTime" "0"
EndSection
# PS4 pad touchpad as the mouse: tap to click (off by default in libinput), faster pointer for a small pad.
Section "InputClass"
  Identifier "touchpad tap"
  MatchIsTouchpad "on"
  Driver "libinput"
  Option "Tapping" "on"
  Option "AccelSpeed" "0.6"
EndSection
